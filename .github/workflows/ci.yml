name: CI

# 为什么这些步骤要重试、缓存、并且把 `moon update` 做成非致命：
# MoonBit 官方文档站的索引是一个 git 仓库，每次全新拉取约 9 MB。
# 在 GitHub 的 runner 上，网络步骤曾经占掉一次运行 7 分 54 秒并超时失败 ——
# 而失败的全部是**网络步骤**，代码检查/构建/测试从没失败过。
# 所以：缓存索引、给网络步骤加重试、并把索引刷新降级为警告。
# 这样"CI 红"就只意味着代码真的有问题。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache MoonBit registry
        uses: actions/cache@v4
        with:
          path: ~/.moon/registry
          key: moon-registry-${{ runner.os }}-${{ hashFiles('moon.mod') }}
          restore-keys: |
            moon-registry-${{ runner.os }}-

      - name: Set up MoonBit
        run: |
          for i in 1 2 3; do
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash && break
            echo "install attempt $i failed, retrying"
            sleep 10
          done
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update dependencies
        # 索引刷新失败不该让整次 CI 变红：依赖已经在 moon.mod 里锁定了
        run: moon update || echo "::warning::moon update failed (treated as non-fatal)"

      - name: Show toolchain version
        run: moon version --all || moon version

      - name: Check
        run: moon check

      - name: Build (native)
        run: moon build --target native

      - name: Test (default target)
        run: moon test

      - name: Test (native)
        run: moon test --target native

      - name: CLI smoke test
        run: |
          BIN="_build/native/debug/build/cmd/main/main.exe"
          [ -x "$BIN" ] || BIN="_build/native/debug/build/cmd/main/main"
          echo "--- eval ---"
          OUT="$("$BIN" eval A1=10 A2=20 B1==A1+A2)"
          echo "$OUT"
          echo "$OUT" | grep -q "B1 = 30" || { echo "unexpected eval output"; exit 1; }
          echo "--- trace ---"
          OUT="$("$BIN" eval --trace A1=1 B1==A1+1 C1==B1*2)"
          echo "$OUT"
          echo "$OUT" | grep -q "recomputed 3 of 3 cells" || { echo "unexpected trace"; exit 1; }
          echo "--- demo ---"
          "$BIN" demo > demo.out
          cat demo.out
          grep -q "recomputed 3 of 7 cells" demo.out \
            || { echo "incremental recalculation did not skip unrelated cells"; exit 1; }
          echo "--- example ---"
          "$BIN" example > example.out
          head -20 example.out
          grep -q "recomputed 6 of 26 cells" example.out \
            || { echo "the worked example no longer shows incremental recalculation"; exit 1; }
          echo "--- bench (light) ---"
          # 规模调小，只验证"增量确实少于全量"这个性质；耗时不作为断言
          # （机器不同，耗时不同，拿它当阈值只会制造假失败）。
          "$BIN" bench --chains=2 --length=200 --repeat=1 > bench.out
          cat bench.out
          grep -q "cells recomputed: 2.0x fewer" bench.out \
            || { echo "incremental recalculation lost its advantage"; exit 1; }
          echo "--- version ---"
          "$BIN" --version
          "$BIN" --version | grep -q "SheetCore v" \
            || { echo "--version did not print a version"; exit 1; }
          echo "CLI smoke test passed"

      - name: CLI error handling
        # 回归测试。这四条都曾经是实际行为：
        #   - `nosuchcmd` 报「expected CELL=CONTENT but got: nosuchcmd」（答非所问）
        #   - `eval --help` / `bench --help` 报错，而不是给帮助
        #   - `demo extra` 静默忽略多余参数
        #   - `bench --length=0` 把三个选项一起念一遍
        #
        # 判定的是输出里的 `error:` 前缀，**不是退出码** —— 原因见 README
        # 「已知限制」：core 没有 exit，置非零退出码要写逐后端 FFI，本项目不用。
        # 命令后面都跟 `|| true`，这样将来若真去置了退出码，这一步也不会假失败。
        run: |
          BIN="_build/native/debug/build/cmd/main/main.exe"
          [ -x "$BIN" ] || BIN="_build/native/debug/build/cmd/main/main"
          fail() { echo "FAIL: $1"; exit 1; }

          echo "--- an unknown command is not read as cell content ---"
          "$BIN" nosuchcmd > out.txt 2>&1 || true
          cat out.txt
          if ! grep -q "error: unknown command: nosuchcmd" out.txt; then
            fail "an unknown command was not reported as such"
          fi
          if grep -q "expected CELL=CONTENT" out.txt; then
            fail "an unknown command is still mistaken for cell content"
          fi

          echo "--- every subcommand answers --help ---"
          for cmd in eval demo example bench; do
            "$BIN" "$cmd" --help > out.txt 2>&1 || true
            if ! grep -q "^Usage: sheetcore $cmd" out.txt; then
              fail "$cmd --help did not print its own usage"
            fi
            if grep -q "error:" out.txt; then
              fail "$cmd --help printed an error instead of help"
            fi
          done

          echo "--- a wrong option names itself, not all three ---"
          "$BIN" bench --length=0 > out.txt 2>&1 || true
          cat out.txt
          if ! grep -q "error: --length must be at least 1, got 0" out.txt; then
            fail "the offending option was not named"
          fi

          echo "--- extra arguments are refused, not ignored ---"
          "$BIN" demo extra > out.txt 2>&1 || true
          if ! grep -q "error: demo takes no arguments" out.txt; then
            fail "an extra argument was silently ignored"
          fi

          echo "CLI error handling passed"
